buildscript {
    apply from: "gradle/versions.gradle"
}

plugins {
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.kotlin.kapt"
    id "org.jetbrains.dokka"

    id "com.github.ben-manes.versions"
}

allprojects {
    version = rootProject.ext.version
    group = rootProject.ext.group

    repositories {
        mavenCentral()

        // kotlinx-html-jvm 0.7.2 (needed by detekt 1.15.0) was only published on JCenter
        exclusiveContent {
            forRepository {
                maven { url "https://packages.jetbrains.team/maven/p/kotlinx-html/maven" }
            }
            filter {
                includeModule "org.jetbrains.kotlinx", "kotlinx-html-jvm"
            }
        }
    }
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        !(it.candidate.version ==~ /^[0-9,.v-]+(-r)?$/)
    }
}

wrapper {
    gradleVersion = project.ext.gradleVersion
}
